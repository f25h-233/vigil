# VIGIL 监听群配置 —— **模板**
#
# ⚠️ 这是**示例**。真实文件是同目录下的 `groups.toml`，它**不入库**（见 .gitignore）。
#    首次使用：把本文件复制成 `groups.toml`，再把下面的群号/群名换成你自己的。
#
#         cp config/groups.example.toml config/groups.toml
#
#    为什么真实文件不入库：里面是**真实群号与群名**，公开出去等于把
#    「这个人盯着哪些群」摊开给人看。

# ── 怎么加群 ───────────────────────────────────────────────
#   1. 跑 `vigil groups`，它会列出 QQ 本地库里所有群
#      （含群号、群名、消息数，以及「是否已纳入」）
#   2. 把新群的 id 按下面格式加一段 [[groups]]
#   3. 重跑 `vigil export`。**每次都是全量重读所有已纳群**（不做增量记账，
#      实测 4.7 万条几秒），写入用 INSERT OR REPLACE，所以重跑不会产生重复行。
#      新群加进来后第一次 export 就会拉到它的全部历史。
#
# ── 怎么退群 ───────────────────────────────────────────────
#   把 enabled 改成 false（保留配置便于回看），或整段删掉。
#   已导出的历史数据留在库里不动——那是你的记录。
#
# ⚠️ **本文件由程序整体重写**（网页「配置」页保存时会覆盖它）：
#    手工改也行，但**手工加的注释会在下一次网页保存时消失**。
#
# 注意：刚加入的新群，QQ 需要先把它同步到本地库
#      （group_info.db 出现群名、nt_msg.db 开始落消息），
#      之后 `vigil groups` 才看得见。刚加完立刻查可能是空的。


[settings]
# QQ NT 本地库目录（换成你自己的路径；`<QQ号>` 是你的 QQ 号）
qq_db_dir = "C:/Users/<用户名>/Documents/Tencent Files/<QQ号>/nt_qq/nt_db"
# 导出目标（相对仓库根，一般不用改）
output_db = "data/vigil.db"

# ── tier：分级 ──
#   high   = 你真正在意的群（导师/班级/团委一类）
#   normal = 顺带看看的群（二手/兴趣/水群）
# 分级会影响日报的取舍与排序。

[[groups]]
id = 123450001
name = "示例群A"
enabled = true
tier = "high"

[[groups]]
id = 123450002
name = "示例群B"
enabled = true
tier = "normal"

[[groups]]
# 已退的群：改成 false 留着回看，或整段删掉
id = 123450003
name = "示例群C（已退）"
enabled = false
tier = "normal"
