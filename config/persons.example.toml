# VIGIL 监视人物名单 —— **模板**
#
# ⚠️ 这是**示例**。真实文件是同目录下的 `persons.toml`，它**不入库**（见 .gitignore）。
#    首次使用：把本文件复制成 `persons.toml`，再把 uin 换成你要盯的人。
#
#         cp config/persons.example.toml config/persons.toml
#
#    为什么真实文件不入库：里面是**真实姓名与真实 QQ 号**，公开出去是别人的隐私。

# ── 怎么加人 ─────────────────────────────────────────────
#   1. 在前端「按人物筛选」里添加，或手工往下面追加一段 [[persons]]
#   2. uin 是 QQ 号。不要填 0（那是匿名哨兵）。
#   3. 本文件由程序原子写出；手工改也行，下次保存会整体覆盖。
#
# label 是你自己起的名字（不是群昵称快照）——群昵称会变，label 不会。

[[persons]]
uin = 100000001
label = "示例人物（班助）"
note = "这是模板里的占位条目，请替换成你自己要盯的人"

[[persons]]
uin = 100000002
label = "示例人物（辅导员）"
note = ""
