[project]
name = "vigil"
version = "0.1.0"
description = "VIGIL 守夜人 —— QQ 群信息聚合器（路线 C：本地数据库旁路）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "sqlcipher3>=0.6.2",
    "uvicorn>=0.53.0",
]

[project.scripts]
vigil = "vigil.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vigil*"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
